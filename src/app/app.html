<div class="container">
  <h1>📝 Otavio 253524 -
    <br>guilherme 252862
  </h1>

  <div class="input-group">
    <input #novaTarefa type="text" placeholder="Digite uma tarefa..." />
    <button (click)="CREATE_tarefa(novaTarefa.value); novaTarefa.value=''">
      Adicionar
    </button>
  </div>

  <ul>
    <li *ngFor="let tarefa of arrayDeTarefas()">
      <span [class.done]="tarefa.statusRealizada">
        {{ tarefa.descricao }}
      </span>

      <div class="actions">
        <button (click)="UPDATE_tarefa(tarefa)">✔</button>
        <button (click)="DELETE_tarefa(tarefa)">❌</button>
      </div>
    </li>
  </ul>
</div>
