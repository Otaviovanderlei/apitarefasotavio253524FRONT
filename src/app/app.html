<div class="main">
  <h1>
    📝 Todo App  
    <span>Otavio 25352 - Guilherme 252862</span>
  </h1>

  <div class="input-area">
    <input class="lg-text-input" #campoNovoItem placeholder="Digite uma tarefa..." />

    <button class="btn-primary"
      (click)="CREATE_tarefa(campoNovoItem.value); campoNovoItem.value=''">
      Adicionar
    </button>
  </div>

  <ul>
    <li *ngFor="let tarefaDoLoop of arrayDeTarefas()">
      <app-item 
        [tarefa]="tarefaDoLoop" 
        (remover)="DELETE_tarefa($event)" 
        (modificaTarefa)="UPDATE_tarefa($event)">
      </app-item>
    </li>
  </ul>
</div>
