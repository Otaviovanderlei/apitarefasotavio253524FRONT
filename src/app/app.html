<div class="main">
  <h1>
    📝Otavio 253524 -<br>
    Guilherme 252862
 </h1>

  <div class="input-area">
    <input 
      class="lg-text-input" 
      #campoNovoItem 
      placeholder="Digite uma tarefa..." 
    />

    <button 
      class="btn-primary"
      (click)="CREATE_tarefa(campoNovoItem.value); campoNovoItem.value=''">
      Adicionar Tarefa
    </button>
  </div>

  <ul>
    <li *ngFor="let tarefaDoLoop of arrayDeTarefas()">
      <app-item 
        [tarefa]="tarefaDoLoop" 
        (remover)="DELETE_tarefa($event)" 
        (modificaTarefa)="UPDATE_tarefa($event)">
      </app-item>
    </li>
  </ul>
</div>
